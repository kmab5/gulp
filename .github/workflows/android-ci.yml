name: Android CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Offline structural verification
        run: |
          python3 tools/verify_gradle_catalog.py
          python3 tools/verify_compose_buildfix.py
          python3 tools/verify_structure.py
          python3 tools/verify_phase4_structure.py
          python3 tools/verify_phase5_structure.py
          python3 tools/verify_release_identity.py
          python3 tools/verify_brand_identity.py
          python3 tools/verify_ui_refresh.py
          python3 tools/verify_ui_review_02.py
          python3 tools/verify_glass_ui.py
          python3 tools/verify_drink_types.py
          python3 tools/verify_general_round.py
          python3 tools/verify_round09_ui.py
          bash tools/verify_round08.sh
      - name: Compile, test, lint and package
        run: |
          gradle --version
          gradle --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug
      - name: Report archive sizes
        if: success()
        run: python3 tools/report_package_size.py
      - name: Upload installable debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gulp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload lint report on failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gulp-phase6-lint-reports
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
